name: CI - build, test, package

on:
  push:
    tags:
      - "v*"
  pull_request:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-test-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake rpm

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis -y

      - name: Configure build
        run: |
          cmake -S rules -B rules/build -DCMAKE_BUILD_TYPE=Release

      - name: Build rules library
        run: cmake --build rules/build --config Release

      - name: Run unit tests
        run: ctest --test-dir rules/build -C Release --output-on-failure

      - name: Run large simulator
        if: runner.os == 'Linux'
        env:
          SIM_TRIALS: 200000
        run: |
          if [ -f rules/build/large_simulator ]; then rules/build/large_simulator "$SIM_TRIALS"; fi
          if [ -f rules/build/Release/large_simulator.exe ]; then rules/build/Release/large_simulator.exe "$SIM_TRIALS"; fi

      - name: Build installable packages
        working-directory: rules/build
        run: cpack -C Release

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: madcraps-rules-${{ runner.os }}
          if-no-files-found: error
          path: |
            rules/build/*.exe
            rules/build/*.msi
            rules/build/*.dmg
            rules/build/*.pkg
            rules/build/*.deb
            rules/build/*.rpm
            rules/build/*.tar.gz
            rules/build/*.zip

      - name: Upload simulation artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: |
            rules/build/simulation_results.csv
            rules/build/simulation_report.md

      - name: Publish release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rules/build/*.exe
            rules/build/*.msi
            rules/build/*.dmg
            rules/build/*.pkg
            rules/build/*.deb
            rules/build/*.rpm
            rules/build/*.tar.gz
            rules/build/*.zip
